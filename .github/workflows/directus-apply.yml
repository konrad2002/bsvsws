name: Directus apply (manual)

# Manual schema/permission run against a deployed environment, e.g. a REVIEWED
# destructive schema change that the automatic deploy refuses (spec §14.3:
# no automatic destructive schema operations). Uses the images (and thus the schema
# snapshot) of the commit the workflow is started from – start it from `master` for
# production and `develop` for test; afterwards re-run the failed deploy job.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [test, production]
        required: true
      mode:
        description: "dry-run = show diff only; destructive = allow dropping fields/collections"
        type: choice
        options: [dry-run, apply, destructive]
        default: dry-run

concurrency:
  group: deploy-${{ inputs.environment == 'production' && 'master' || 'develop' }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check branch
        run: |
          expected=${{ inputs.environment == 'production' && 'master' || 'develop' }}
          [ "$GITHUB_REF_NAME" = "$expected" ] || { echo "::error::Start this workflow from '$expected' for ${{ inputs.environment }}"; exit 1; }
      - name: Configure SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          USER_NAME: ${{ secrets.VPS_USER }}
          PORT: ${{ vars.VPS_PORT || '22' }}
        # Host keys are never accepted blindly: VPS_KNOWN_HOSTS = output of
        # `ssh-keyscan [-p <port>] <VPS_HOST>` (docs/09-infrastructure.md).
        run: |
          for v in KEY KNOWN_HOSTS HOST USER_NAME; do
            [ -n "${!v}" ] || { echo "::error::Secret/variable for $v missing in this GitHub Environment"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $HOST
            User $USER_NAME
            Port $PORT
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          ssh deploy-target true || { echo "::error::SSH to the deploy host failed – check VPS_HOST/VPS_USER/VPS_PORT, VPS_KNOWN_HOSTS (ssh-keyscan) and the deploy key"; exit 1; }
      - name: Run apply
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          MODE: ${{ inputs.mode }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$MODE" in
            dry-run) ARGS="--dry-run" ;;
            apply) ARGS="" ;;
            destructive) ARGS="--allow-destructive" ;;
          esac
          # Arguments are expanded here on purpose (paths/sha), then run remotely.
          # shellcheck disable=SC2029
          remote() { ssh deploy-target "$@"; }
          printf '%s' "$GHCR_TOKEN" | remote "DOCKER_CONFIG='$DEPLOY_DIR/.docker' docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          set +e
          remote "DOCKER_CONFIG='$DEPLOY_DIR/.docker' IMAGE_TAG='$GITHUB_SHA' bash '$DEPLOY_DIR/tools.sh' '$DEPLOY_DIR' apply $ARGS"
          rc=$?
          remote "DOCKER_CONFIG='$DEPLOY_DIR/.docker' docker logout ghcr.io >/dev/null"
          exit $rc
