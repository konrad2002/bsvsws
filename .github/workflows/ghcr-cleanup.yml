name: GHCR cleanup

# Keeps private registry storage small (spec §16.2: no unplanned paid usage): only
# the newest 30 versions of each image stay available for deploys/rollbacks.
on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

permissions:
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [web, api, directus, tools]
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: bsv-sws/${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 30
